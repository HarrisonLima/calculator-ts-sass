<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <script
      src="https://kit.fontawesome.com/fb57ddc8bd.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="./src/style/styles.css" />
    <title>Calculadora</title>
  </head>
  <body>
    <section class="section">
      <div class="calculadora">
        <div class="calculadora__content">
          <input
            class="input"
            type="text"
            titulo="Operation"
            placeholder="0"
            disabled
          />
          <div class="calculadora__content__digits">
            <button class="button button--primary" id="btnPercent" value="%">
              %
            </button>
            <button class="button button--primary" value="/">/</button>
            <button
              class="button button--secondary"
              value="Backspace"
              titulo="Backspace"
            >
              <i class="fa-solid fa-delete-left"></i>
            </button>
            <button class="button button--primary" value="7">7</button>
            <button class="button button--primary" value="8">8</button>
            <button class="button button--primary" value="9">9</button>
            <button class="button button--primary" value="*">*</button>
            <button class="button button--primary" value="4">4</button>
            <button class="button button--primary" value="5">5</button>
            <button class="button button--primary" value="6">6</button>
            <button class="button button--primary" value="-">-</button>
            <button class="button button--primary" value="1">1</button>
            <button class="button button--primary" value="2">2</button>
            <button class="button button--primary" value="3">3</button>
            <button class="button button--primary" value="+">+</button>
            <button class="button button--secondary" value="Clear">C</button>
            <button class="button button--primary" value="0">0</button>
            <button class="button button--primary" value=",">.</button>
            <button class="button button--tertiary" value="=">=</button>
          </div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <div class="footer__content">
        <ul class="footer__socials">
          <li>
            <a
              title="email"
              href="mailto:harrisonlima92@gmail.com"
              target="_blank"
              rel="noopener noreferrer"
              ><i id="iconEmail" class="fa-solid fa-envelope footer__icon"></i
            ></a>
          </li>
          <li>
            <a
              title="linkedin"
              href="https://www.linkedin.com/in/harrison-fabiano-de-lima/"
              target="_blank"
              rel="noopener noreferrer"
              ><i
                id="iconLinkedin"
                class="fa-brands fa-linkedin footer__icon"
              ></i
            ></a>
          </li>
          <li>
            <a
              title="github"
              href="https://github.com/HarrisonLima"
              target="_blank"
              rel="noopener noreferrer"
              ><i id="iconGithub" class="fa-brands fa-github footer__icon"></i
            ></a>
          </li>
        </ul>
        <p class="footer__copyright">
          &copy;2024 <strong>Harrison Fabiano de Lima.</strong> Todos os
          direitos reservados.
        </p>
      </div>
    </footer>
    <script type="module" src="./src/js/script.js"></script>
  </body>
</html>
